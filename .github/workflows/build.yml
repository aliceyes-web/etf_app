name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ETF-Portfolio.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Portfolio-apk
          path: ETF-Portfolio.apk

      - name: Publish as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" ETF-Portfolio.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK built by GitHub Actions (run ${{ github.run_number }})."
