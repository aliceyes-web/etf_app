<body>
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --card2:#f6f8fb; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --navy:#1e3a5f; --navy-soft:#2c4f7c; --green:#0f6d4d; --green-soft:#178a63;
  --accent:#2f6fe4; --accent-soft:#e8f0fe; --a1:#8e1d33; --a2:#3b3f9e;
  --up:#d92d20; --down:#0f9d58; --chip:#eef1f6; --chipText:#4b5563;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --radius:16px; --tabh:60px; --toph:52px;
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --card2:#1e232c; --text:#e8eaed; --muted:#9aa3af; --line:#272d37;
  --navy:#16283f; --navy-soft:#24405f; --green:#0b5238; --green-soft:#12734f;
  --accent:#4b86f0; --accent-soft:#1b2740;
  --up:#ff5a4d; --down:#22c07a; --chip:#232935; --chipText:#c2c8d2;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.45; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{
  background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hide{display:none !important}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}

/* ---------- chrome ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:calc(var(--toph) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;z-index:40;
}
.acct{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700}
.acct .caret{font-size:12px;color:var(--muted)}
.avatar{
  width:36px;height:36px;border-radius:50%;background:var(--chip);
  display:flex;align-items:center;justify-content:center;font-size:20px
}
main{
  padding:calc(var(--toph) + env(safe-area-inset-top) + 10px) 12px
          calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  max-width:620px;margin:0 auto;
}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  height:calc(var(--tabh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;color:var(--muted)}
.tabbar button .ic{font-size:21px;line-height:1}
.tabbar button.on{color:var(--accent);font-weight:700}

/* ---------- blocks ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.sec-title{font-size:19px;font-weight:800;margin:16px 4px 10px;display:flex;align-items:center;gap:8px}
.hero{border-radius:20px;padding:16px;margin-bottom:14px;color:#fff}
.hero.navy{background:var(--navy)} .hero.green{background:var(--green)}
.hero .row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0}
.hero .k{color:rgba(255,255,255,.72);font-size:14px}
.hero .v{font-size:17px;font-weight:700}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hero hr{border:none;border-top:1px solid rgba(255,255,255,.18);margin:10px 0}
.hero-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
  color:rgba(255,255,255,.85);font-size:15px;font-weight:600}
.hero-head .tools{display:flex;gap:12px;align-items:center;font-size:14px}
.hero-head .tools button{color:rgba(255,255,255,.9)}

.segs{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:4px;border-radius:999px}
.segs.light{background:var(--chip)}
.segs button{flex:1;padding:7px 4px;border-radius:999px;font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
.segs.light button{color:var(--chipText)}
.segs button.on{background:#fff;color:#111827}
.segs.light button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.monthnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 2px}
.monthnav button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff}
.monthnav .lbl{font-size:19px;font-weight:700}

.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--chipText);font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:#fff}
.chip.plain.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.item .hl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.code{font-size:21px;font-weight:800;letter-spacing:.5px}
.nm{color:var(--muted);font-size:14px}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.kv .k{color:var(--muted)}
.divider{border-top:1px solid var(--line);margin:10px 0}
.badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;flex:0 0 auto}
.badge.buy{background:rgba(15,157,88,.14);color:var(--down)}
.badge.sell{background:rgba(217,45,32,.14);color:var(--up)}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.ok{background:rgba(15,157,88,.14);color:var(--down)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}

.btn{padding:12px 16px;border-radius:12px;font-weight:700;font-size:16px;background:var(--chip);color:var(--text);text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:var(--green-soft);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{display:block;width:100%}
.btn2{display:grid;grid-template-columns:1fr auto;gap:10px}

.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);
  width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(47,111,228,.4);z-index:35}
.fab.green{background:var(--green);box-shadow:0 6px 20px rgba(15,109,77,.4)}

.list-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.list-row .ic{font-size:20px;width:26px;text-align:center}
.list-row .gt{margin-left:auto;color:var(--muted)}
.group{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}

/* analysis */
.acard{border-radius:20px;padding:16px 150px 18px 16px;margin-bottom:12px;position:relative;overflow:hidden;color:#fff;min-height:150px}
.acard .pct{font-size:42px;font-weight:800;letter-spacing:-1px;margin:6px 0 4px}
.acard .sub{font-size:14px;opacity:.85}
.acard .pill{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.22);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px}
.acard .bars{position:absolute;right:16px;bottom:0;display:flex;align-items:flex-end;gap:8px;height:96px}
.acard .bars i{display:block;width:40px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.45)}

<script>
/* =========================================================
   台股 ETF 投資組合追蹤 — 單檔 PWA
   資料全部存在本機瀏覽器 (localStorage)，不會上傳任何地方
   ========================================================= */
(function(){
'use strict';

const KEY='twetf_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 預設資料 ---------- */
function blankBook(){return{trades:[],divs:[],events:[],prices:{},names:{},order:[]};}
function defaultState(){
  const id=uid();
  return{
    v:1, activeId:id, theme:'system', palette:'ocean', hide:false,
    accounts:[{id,name:'我的帳戶',avatar:'🐱'}],
    books:{[id]:blankBook()},
    cfg:{feeRate:0.1425,feeDisc:1,feeMin:20,taxEtf:0.1,taxStk:0.3,proxy:''},
    ui:{holdSort:'code',trPeriod:'month',trAnchor:todayStr().slice(0,7),trSort:'date',
        dvPeriod:'month',dvAnchor:todayStr().slice(0,7)}
  };
}
let S=defaultState();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const o=JSON.parse(raw);
      S=Object.assign(defaultState(),o);
      S.cfg=Object.assign(defaultState().cfg,o.cfg||{});
      S.ui=Object.assign(defaultState().ui,o.ui||{});
      if(!S.accounts||!S.accounts.length)S=defaultState();
      if(!S.books[S.activeId])S.activeId=S.accounts[0].id;
      S.accounts.forEach(a=>{if(!S.books[a.id])S.books[a.id]=blankBook();});
      Object.values(S.books).forEach(b=>{
        b.trades=b.trades||[];b.divs=b.divs||[];b.events=b.events||[];
        b.prices=b.prices||{};b.names=b.names||{};b.order=b.order||[];
      });
    }
  }catch(e){console.warn('load fail',e);}
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(S));}
    catch(e){toast('儲存失敗：'+e.message);}
  },60);
}
const book=()=>S.books[S.activeId];
const acct=()=>S.accounts.find(a=>a.id===S.activeId)||S.accounts[0];

/* ---------- 工具 ---------- */
function todayStr(d){d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtTime(ts){const d=new Date(ts);
  return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+
         String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function addDays(dateStr,n){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n);return todayStr(d);}
function nf(n,d){d=d==null?0:d;
  return (Math.round((n||0)*Math.pow(10,d))/Math.pow(10,d)).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function money(n,d){const v=S.hide?'****':nf(n,d||0);return 'NT$ '+v;}
function signed(n,d){const s=n>0?'+':(n<0?'-':'');return s+nf(Math.abs(n),d||0);}
function pct(n,d){d=d==null?2:d;if(!isFinite(n))return '—';return (n>0?'+':'')+nf(n,d)+'%';}
function cls(n){return n>0?'up':(n<0?'down':'');}
function isEtf(code){return /^00/.test(String(code));}
function stockName(code){const b=book();return b.names[code]||'';}
function setName(code,name){if(name){book().names[code]=name;}}

/* 預設手續費／證交稅 */
function calcFee(amount){
  const c=S.cfg,f=Math.round(amount*(c.feeRate/100)*(c.feeDisc||1));
  return Math.max(f, amount>0?Math.min(c.feeMin,f||c.feeMin):0);
}
function calcTax(code,amount){
  const c=S.cfg;return Math.round(amount*((isEtf(code)?c.taxEtf:c.taxStk)/100));
}

/* ---------- 持倉計算 (FIFO) ---------- */
function compute(){
  const b=book();
  const trades=b.trades.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.seq||0)-(y.seq||0));
  const H={};   // code -> holding
  const realizedRows=[];
  for(const t of trades){
    const c=t.code;
    if(!H[c])H[c]={code:c,name:t.name||stockName(c),lots:[],shares:0,cost:0,realized:0,buyAmt:0,sellAmt:0,divTotal:0,divPerShare:0,div12:0,firstDate:t.date};
    const h=H[c];
    if(t.name)h.name=t.name;
    const amt=t.shares*t.price;
    if(t.type==='buy'){
      h.lots.push({shares:t.shares,price:t.price,fee:t.fee||0,date:t.date});
      h.shares+=t.shares; h.cost+=amt+(t.fee||0); h.buyAmt+=amt;
    }else{
      let left=t.shares, costOut=0;
      while(left>0&&h.lots.length){
        const lot=h.lots[0], take=Math.min(left,lot.shares);
        const unit=lot.price+(lot.fee||0)/lot.shares;
        costOut+=take*unit; lot.shares-=take; left-=take;
        if(lot.shares<=0.0000001)h.lots.shift();
      }
      const proceeds=amt-(t.fee||0)-(t.tax||0);
      const pl=proceeds-costOut;
      h.realized+=pl; h.shares-=t.shares; h.cost=Math.max(0,h.cost-costOut); h.sellAmt+=amt;
      realizedRows.push({code:c,date:t.date,pl:pl});
    }
  }
  // 配息
  const oneYearAgo=new Date();oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
  const y1=todayStr(oneYearAgo);
  for(const d of b.divs){
    const c=d.code;
    if(!H[c])H[c]={code:c,name:d.name||stockName(c),lots:[],shares:0,cost:0,realized:0,buyAmt:0,sellAmt:0,divTotal:0,divPerShare:0,div12:0,firstDate:d.date};
    const h=H[c]; const amt=divAmount(d);
    h.divTotal+=amt;
    if((d.date||'')>=y1){h.div12+=amt;h.divPerShare+=(+d.perShare||0);}
  }
  // 現價與市值
  const list=[];
  for(const c in H){
    const h=H[c];
    const p=b.prices[c]||{};
    h.price=(p.price!=null?+p.price:null);
    h.prevClose=(p.prev!=null?+p.prev:null);
    h.priceTime=p.time||''; h.priceSrc=p.src||'';
    h.avg=h.shares>0?h.cost/h.shares:0;
    h.noPrice=h.shares>0&&h.price==null;
    h.value=h.shares>0?(h.price!=null?h.shares*h.price:h.cost):0;  // 未設定價格時以成本計，避免市值失真
    h.unreal=h.shares>0&&h.price!=null?h.value-h.cost:0;
    h.unrealPct=h.cost>0&&h.shares>0&&h.price!=null?h.unreal/h.cost*100:0;
    h.dayChg=(h.price!=null&&h.prevClose!=null)?(h.price-h.prevClose):null;
    h.dayPl=h.dayChg!=null?h.dayChg*h.shares:null;
    h.yieldPct=(h.price&&h.divPerShare)?(h.divPerShare/h.price*100):0;
    h.total=h.unreal+h.realized+h.divTotal;
    list.push(h);
  }
  const held=list.filter(h=>h.shares>0.0000001);
  const sum={
    value:held.reduce((a,h)=>a+h.value,0),
    cost:held.reduce((a,h)=>a+h.cost,0),
    unreal:held.reduce((a,h)=>a+h.unreal,0),
    realized:list.reduce((a,h)=>a+h.realized,0),
    div:list.reduce((a,h)=>a+h.divTotal,0),
    dayPl:held.reduce((a,h)=>a+(h.dayPl||0),0),
    invested:list.reduce((a,h)=>a+h.buyAmt,0)
  };
  sum.unrealPct=sum.cost>0?sum.unreal/sum.cost*100:0;
  sum.total=sum.unreal+sum.realized+sum.div;
  return {list,held,sum,realizedRows};
}
function divAmount(d){
  if(d.amount!=null&&d.amount!=='')return +d.amount;
  return Math.round((+d.perShare||0)*(+d.shares||0)-(+d.tax||0));
}
/* 某日期時的持股（用於除息事件推算） */
function sharesAt(code,date,strict){
  // strict=true：只算「早於」該日的交易（除息日當天才買進的股票沒有配息權利）
  const b=book();let s=0;
  b.trades.filter(t=>t.code===code&&(strict?t.date<date:t.date<=date)).forEach(t=>{s+=t.type==='buy'?t.shares:-t.shares;});
  return s;
}

/* ---------- 期間 ---------- */
function periodRange(mode,anchor){
  // anchor: 'YYYY-MM'
  const [y,m]=anchor.split('-').map(Number);
  if(mode==='month')return{from:anchor+'-01',to:anchor+'-31',label:y+' 年 '+m+' 月'};
  if(mode==='quarter'){const q=Math.floor((m-1)/3),s=q*3+1;
    return{from:y+'-'+String(s).padStart(2,'0')+'-01',to:y+'-'+String(s+2).padStart(2,'0')+'-31',label:y+' 年 Q'+(q+1)};}
  if(mode==='year')return{from:y+'-01-01',to:y+'-12-31',label:y+' 年'};
  return{from:'0000-01-01',to:'9999-12-31',label:'全部期間'};
}
function shiftAnchor(anchor,mode,dir){
  let [y,m]=anchor.split('-').map(Number);
  if(mode==='month'){m+=dir;if(m>12){m=1;y++;}if(m<1){m=12;y--;}}
  else if(mode==='quarter'){m+=dir*3;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}}
  else if(mode==='year'){y+=dir;}
  else return anchor;
  return y+'-'+String(m).padStart(2,'0');
}
function inRange(date,r){return date>=r.from&&date<=r.to;}

/* ---------- UI helpers ---------- */
function toast(msg,ms){
  const old=$('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),ms||2200);
}
function closeSheet(){const m=$('#modalRoot');m.innerHTML='';}
function sheet(title,bodyHtml,onMount){
  const m=$('#modalRoot');
  m.innerHTML='<div class="mask" data-close="1"><div class="sheet"><h3>'+esc(title)+'</h3>'+bodyHtml+'</div></div>';
  $('.mask',m).addEventListener('click',e=>{if(e.target.dataset.close)closeSheet();});
  if(onMount)onMount($('.sheet',m));
}
function confirmSheet(title,msg,onYes,yesLabel){
  sheet(title,'<p class="muted" style="margin:0 0 16px">'+esc(msg)+'</p>'+
    '<div class="btn2"><button class="btn primary" id="cfY">'+esc(yesLabel||'確定')+'</button>'+
    '<button class="btn" id="cfN">取消</button></div>',el=>{
      $('#cfY',el).onclick=()=>{closeSheet();onYes();};
      $('#cfN',el).onclick=closeSheet;
    });
}
/* ---------- 色系（淺色 l／深色 d 各一組；ocean 使用 CSS 預設值） ---------- */
const PALETTES={
  ocean:{name:'海軍藍',sw:'#1e3a5f',ac:'#2f6fe4',l:null,d:null},
  teal:{name:'湖水青',sw:'#0e4f5c',ac:'#0e8f9c',
    l:{'--navy':'#0e4f5c','--navy-soft':'#17707f','--green':'#0f766e','--green-soft':'#14917f','--accent':'#0e8f9c','--accent-soft':'#e0f5f7','--a1':'#5b2a4a','--a2':'#1e3f6f'},
    d:{'--navy':'#0b3a44','--navy-soft':'#14586a','--green':'#0b5a54','--green-soft':'#12806f','--accent':'#1a97a5','--accent-soft':'#12303a','--a1':'#4a2140','--a2':'#1a3358'}},
  forest:{name:'森林綠',sw:'#1b4d3e',ac:'#2f9e63',
    l:{'--navy':'#1b4d3e','--navy-soft':'#2b6650','--green':'#14532d','--green-soft':'#1f8a4c','--accent':'#2f9e63','--accent-soft':'#e3f5ea','--a1':'#5b2a3a','--a2':'#1f4a5c'},
    d:{'--navy':'#123a2e','--navy-soft':'#1e5240','--green':'#0f4023','--green-soft':'#1a7a43','--accent':'#2a9d68','--accent-soft':'#14301f','--a1':'#4a2230','--a2':'#183c4a'}},
  violet:{name:'紫羅蘭',sw:'#3b2f6b',ac:'#7c5cc4',
    l:{'--navy':'#3b2f6b','--navy-soft':'#54449a','--green':'#5b3d8f','--green-soft':'#7c5cc4','--accent':'#7c5cc4','--accent-soft':'#efe9fb','--a1':'#6b2d5c','--a2':'#2f3a8f'},
    d:{'--navy':'#2a2150','--navy-soft':'#3f3480','--green':'#432d6b','--green-soft':'#6a4cb0','--accent':'#8468d6','--accent-soft':'#231d3f','--a1':'#52214a','--a2':'#232c70'}},
  amber:{name:'暖橘',sw:'#8a4b12',ac:'#e07a1f',
    l:{'--navy':'#8a4b12','--navy-soft':'#a35f22','--green':'#7a5a10','--green-soft':'#b8841f','--accent':'#e07a1f','--accent-soft':'#fdf0e0','--a1':'#7f1d1d','--a2':'#5b3a12'},
    d:{'--navy':'#5e3309','--navy-soft':'#7a4614','--green':'#54400b','--green-soft':'#94691a','--accent':'#d9822c','--accent-soft':'#33240f','--a1':'#5c1717','--a2':'#43290c'}},
  graphite:{name:'石墨灰',sw:'#2f3640',ac:'#4b5563',
    l:{'--navy':'#2f3640','--navy-soft':'#454e5a','--green':'#3d4a45','--green-soft':'#5c6b66','--accent':'#4b5563','--accent-soft':'#eceff3','--a1':'#3f2f3a','--a2':'#2f3a4f'},
    d:{'--navy':'#1f242b','--navy-soft':'#323944','--green':'#2a3430','--green-soft':'#4a5853','--accent':'#64748b','--accent-soft':'#1c222b','--a1':'#33252f','--a2':'#232d40'}}
};
const PAL_VARS=['--navy','--navy-soft','--green','--green-soft','--accent','--accent-soft','--a1','--a2'];
function applyPalette(t){
  const root=document.documentElement.style;
  PAL_VARS.forEach(k=>root.removeProperty(k));
  const p=PALETTES[S.palette]||PALETTES.ocean;
  const set=t==='dark'?p.d:p.l;
  if(set)Object.keys(set).forEach(k=>root.setProperty(k,set[k]));
}
function applyTheme(){
  const t=S.theme==='system'
    ?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')
    :S.theme;
  document.documentElement.setAttribute('data-theme',t);
  applyPalette(t);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute('content',t==='dark'?'#0e1116':'#eef2f7');
}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')applyTheme();});

/* =================== 總覽 =================== */
function viewOverview(){
  const {held,sum}=compute();
  const s=S.ui.holdSort;
  const sorted=held.slice().sort((a,b)=>{
    if(s==='code')return a.code<b.code?-1:1;
    if(s==='pl')return b.unrealPct-a.unrealPct;
    if(s==='value')return b.value-a.value;
    if(s==='yield')return b.yieldPct-a.yieldPct;
    const o=book().order;const ia=o.indexOf(a.code),ib=o.indexOf(b.code);
    return (ia<0?999:ia)-(ib<0?999:ib);
  });
  let h='<div class="hero navy">'+
    '<div class="hero-head"><span>投資組合總覽</span><span class="tools">'+
      '<button id="eyeBtn">'+(S.hide?'🙈':'👁')+'</button>'+
      '<button id="refBtn">↻ 重新整理</button></span></div>'+
    '<div class="row"><span class="k">市值</span><span class="big num">'+money(sum.value)+'</span></div>'+
    '<div class="row"><span class="k">成本</span><span class="big num">'+money(sum.cost)+'</span></div><hr>'+
    row('未實現損益',(S.hide?'****':signed(sum.unreal)+' ('+pct(sum.unrealPct)+')'),cls(sum.unreal))+
    row('已實現損益',(S.hide?'****':signed(sum.realized)),cls(sum.realized))+
    row('股利收入',(S.hide?'****':signed(sum.div)),cls(sum.div))+
    row('總損益',(S.hide?'****':signed(sum.total)),cls(sum.total))+
  '</div>';

  h+='<div class="sec-title">持倉明細</div>';
  h+='<div class="chips" id="sortChips">'+
    [['custom','自訂'],['code','股號'],['pl','損益%'],['value','市值'],['yield','殖利率']]
      .map(([k,l])=>'<button class="chip plain '+(s===k?'on':'')+'" data-s="'+k+'">'+l+'</button>').join('')+
    '</div>';

  if(!sorted.length){
    h+='<div class="card empty">尚無持倉，點右下角 ＋ 新增一筆買進交易</div>';
  }else{
    h+=sorted.map(x=>{
      const priceTxt=x.price!=null?nf(x.price,2):'—';
      return '<div class="item" data-code="'+esc(x.code)+'">'+
        '<div class="hl"><div><div class="code">'+esc(x.code)+'</div><div class="nm">'+esc(x.name||'')+'</div></div>'+
        '<div style="text-align:right"><div class="code num">$'+priceTxt+'</div>'+
        '<div class="nm num">'+nf(x.shares)+' 股</div></div></div>'+
        '<div class="divider"></div>'+
        kv('市值',money(x.value))+
        kv('均成本','NT$ '+nf(x.avg,2))+
        kv('未實現損益',x.noPrice?'<span class="muted">尚未設定現價</span>'
            :'<span class="'+cls(x.unreal)+'">'+(S.hide?'****':signed(x.unreal)+' ('+pct(x.unrealPct)+')')+'</span>')+
        kv('近一年殖利率',x.yieldPct?nf(x.yieldPct,2)+'%':'—')+
      '</div>';
    }).join('');
  }
  setView(h,'trade');

function holdingSheet(code){

  const dvs=b.divs.filter(d=>d.code===code).sort((a,c)=>a.date<c.date?1:-1).slice(0,6);
  let h='<div class="card" style="box-shadow:none;background:var(--card2)">'+
    kv('持股',nf(x.shares)+' 股')+kv('均成本','NT$ '+nf(x.avg,2))+
    kv('現價',x.price!=null?'NT$ '+nf(x.price,2)+(x.priceTime?' <span class="muted" style="font-weight:400">'+esc(x.priceTime)+'</span>':''):'未設定')+
    kv('市值',money(x.value))+
    kv('未實現損益','<span class="'+cls(x.unreal)+'">'+signed(x.unreal)+' ('+pct(x.unrealPct)+')</span>')+
    kv('已實現損益','<span class="'+cls(x.realized)+'">'+signed(x.realized)+'</span>')+
    kv('累計配息','<span class="up">'+signed(x.divTotal)+'</span>')+
    kv('總損益','<span class="'+cls(x.total)+'">'+signed(x.total)+'</span>')+'</div>';

/* =================== 分析 =================== */
function analyseDividends(){
  const b=book(),today=new Date(),y=today.getFullYear();
  const mmdd=todayStr().slice(4);
  const ytd=b.divs.filter(d=>d.date>=y+'-01-01'&&d.date<=todayStr());
  const ly =b.divs.filter(d=>d.date>=(y-1)+'-01-01'&&d.date<=(y-1)+mmdd);
  const sum=a=>a.reduce((x,d)=>x+divAmount(d),0);
  const per=arr=>{const m={};arr.forEach(d=>{const c=d.code;m[c]=m[c]||{ps:0,sh:0,amt:0};
    m[c].ps+=(+d.perShare||0);m[c].sh=Math.max(m[c].sh,+d.shares||0);m[c].amt+=divAmount(d);});return m;};
  const A=per(ytd),B=per(ly);
  let base=0,cf=0;
  Object.keys(B).forEach(c=>{base+=B[c].ps*B[c].sh;cf+=((A[c]&&A[c].ps)||0)*B[c].sh;});
  const ytdT=sum(ytd),lyT=sum(ly);
  return{ytdT,lyT,
    yoy:lyT>0?(ytdT/lyT-1)*100:null,
    psGrowth:base>0?(cf/base-1)*100:null,
    addGrowth:cf>0?(ytdT/cf-1)*100:null};
}
function viewAnalysis(){
  const {sum}=compute(),D=analyseDividends();

  const capPct=basis>0?(sum.unreal+sum.realized)/basis*100:0;
  const h1=Math.max(6,Math.min(88,Math.abs(capPct)));

  let h='<div class="acard red"><button class="pill" data-go="rt">拆解 →</button>'+
    '<div>累計總報酬</div><div class="pct">'+pct(totalPct,0)+'</div>'+
    '<div class="sub">配息 '+pct(divPct,0)+' ・ 價差 '+pct(capPct,0)+'</div>'+
    '<div class="sub">投入成本 '+money(basis)+'</div>'+
    '<div class="bars"><i style="height:'+h1+'%"></i><i style="height:'+h2+'%;opacity:.6"></i></div></div>';

  h+='<div class="acard indigo"><button class="pill" data-go="yoy">同期 →</button>'+
    '<div style="max-width:60%">今年至今配息比去年同期</div>'+

  h+='<div class="acard plain"><button class="pill" data-go="ps">成長 →</button>'+

    (D.psGrowth==null?'<div class="pct" style="font-size:24px;color:var(--muted)">資料不足</div>':'<div class="pct">'+pct(D.psGrowth,0)+'</div>')+
    '<div class="sub muted">'+(D.addGrowth==null?'需要連續兩年的配息記錄才能拆解':'總額成長中 '+pct(D.addGrowth,0)+' 來自加碼')+'</div>'+
    '<div class="bars"><i style="height:40%"></i><i style="height:70%"></i></div></div>';

  const {held}=compute();

        '<span class="num">'+nf(p,1)+'%</span></div>'+

        '<div style="height:100%;width:'+p.toFixed(1)+'%;background:var(--accent)"></div></div></div>';

/* ---- Open API 抓價 ---- */
let quoteCache={t:0,map:null};
function withProxy(u){const p=(S.cfg.proxy||'').trim();return p?p+encodeURIComponent(u):u;}

/* ---- Android 外殼橋接（網頁版沒有 AndroidBridge，這段會被略過） ---- */
function isNative(){return !!(window.AndroidBridge&&typeof window.AndroidBridge.httpGet==='function');}
const _nq={};let _nid=0;
window.__nativeCb=function(id,ok,body){
  const q=_nq[id];if(!q)return;delete _nq[id];
  if(ok)q.res(body);else q.rej(new Error(body||'連線失敗'));
};
function nativeGet(url){
  return new Promise((res,rej)=>{
    const id=String(++_nid);_nq[id]={res,rej};
    try{window.AndroidBridge.httpGet(id,url);}catch(e){delete _nq[id];rej(e);return;}
    setTimeout(()=>{if(_nq[id]){delete _nq[id];rej(new Error('連線逾時'));}},25000);
  });
}
function jget(u){
  if(isNative())return nativeGet(u).then(t=>JSON.parse(t));
  return fetch(withProxy(u),{cache:'no-store'}).then(r=>{
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  });
}
/* 盤中即時報價（證交所 MIS，需原生連線才能取得） */
function parseRealtime(j){
  const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null;};
  const map={};
  ((j&&j.msgArray)||[]).forEach(o=>{
    if(!o||!o.c)return;
    const prev=num(o.y);
    let price=num(o.z);                                   // 最新成交價（未成交時為 "-"）
    if(price==null&&o.b)price=num(String(o.b).split('_')[0]); // 改用委買第一檔
    if(price==null)price=prev;
    if(price==null)return;
    map[o.c]={price,prev:prev!=null?prev:price,name:o.n,src:'MIS',time:'即時 '+(o.t||'')};
  });
  return map;
}
function fetchRealtime(codes){
  if(!codes.length)return Promise.resolve({});
  const ex=codes.map(c=>'tse_'+c+'.tw|otc_'+c+'.tw').join('|');
  return nativeGet('https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch='+ex+'&json=1&delay=0')
    .then(t=>parseRealtime(JSON.parse(t)));
}
function fetchAll(force){
  if(!force&&quoteCache.map&&Date.now()-quoteCache.t<120000)return Promise.resolve(quoteCache.map);
  const map={};
  const twse=jget('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL').then(arr=>{
    (arr||[]).forEach(o=>{
      const close=parseFloat(String(o.ClosingPrice).replace(/,/g,''));
      const chg=parseFloat(String(o.Change).replace(/,/g,''));
      if(isFinite(close))map[o.Code]={price:close,prev:isFinite(chg)?close-chg:close,name:o.Name,src:'TWSE',time:'收盤 '+todayStr()};
    });
  }).catch(e=>{console.warn('twse',e);});
  const tpex=jget('https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes').then(arr=>{
    (arr||[]).forEach(o=>{
      const close=parseFloat(String(o.Close).replace(/,/g,''));
      const chg=parseFloat(String(o.Change).replace(/,/g,''));
      const c=o.SecuritiesCompanyCode||o.Code;
      if(c&&isFinite(close))map[c]={price:close,prev:isFinite(chg)?close-chg:close,name:o.CompanyName||o.Name,src:'TPEx',time:'收盤 '+todayStr()};
    });
  }).catch(e=>{console.warn('tpex',e);});
  return Promise.all([twse,tpex]).then(()=>{
    if(!Object.keys(map).length)throw new Error('無法取得報價（可能被瀏覽器跨網域限制擋下）');
    quoteCache={t:Date.now(),map};return map;
  });
}
let lastQuoteAt=0;
function fetchQuotes(force){
  if(quoteBusy)return;
  const {held}=compute();
  if(!held.length){toast('尚無持倉');return;}
  quoteBusy=true;render();
  lastQuoteAt=Date.now();
  const codes=held.map(x=>x.code);
  const src=isNative()
    ?fetchRealtime(codes).then(m=>Object.keys(m).length?m:fetchAll(force)).catch(()=>fetchAll(force))
    :fetchAll(force);
  src.then(map=>{
    let n=0;
    held.forEach(x=>{
      const r=map[x.code];
      if(r){book().prices[x.code]={price:r.price,prev:r.prev,time:r.time,src:r.src};if(r.name)setName(x.code,r.name);n++;}
    });
    save();quoteBusy=false;render();
    toast(n?('已更新 '+n+' 檔報價'):'查無對應報價');
  }).catch(e=>{quoteBusy=false;render();toast(e.message);});
}

/* =================== 配息公告自動抓取 =================== */
let divBusy=false;
/* '1151021'（民國）、'115年10月21日'、'2026-10-21' → 'YYYY-MM-DD'，認不出來回傳 '' */
function rocDate(s){
  s=String(s==null?'':s).trim();
  let m=s.match(/^(\d{2,3})(\d{2})(\d{2})$/);
  if(m)return(+m[1]+1911)+'-'+m[2]+'-'+m[3];
  m=s.match(/(\d{2,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/);
  if(m)return(+m[1]+1911)+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
  if(m)return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  return '';
}
/* 每股配息：空字串／null／非數字 → null（代表尚未公告） */
function parsePs(v){
  if(v==null)return null;
  const t=String(v).trim();
  if(!t||t.length>20)return null;
  const n=parseFloat(t.replace(/,/g,'').replace(/[^\d.]/g,''));
  return isFinite(n)&&n>0?n:null;
}
/* 把抓到的公告合併進「除息事件」。found: {code|exDate: {code,name,exDate,payDate,perShare}} */
function mergeDivEvents(found,codes){
  const b=book(),today=todayStr(),limit=addDays(today,-45);
  let added=0,updated=0;
  Object.keys(found).forEach(k=>{
    const f=found[k];
    if(f.exDate<limit)return;
    let ev=b.events.find(e=>e.code===f.code&&e.exDate===f.exDate);
    if(ev){
      // 只自動更新「自動建立、尚未處理」的事件；你手動改過或已處理的不動
      if(ev.auto&&ev.status==='pending'){
        let ch=false;
        if(f.perShare!=null&&ev.perShare!==f.perShare){ev.perShare=f.perShare;ch=true;}
        if(f.payDate&&ev.payDate!==f.payDate){ev.payDate=f.payDate;ch=true;}
        if(f.name&&!ev.name)ev.name=f.name;
        if(ch)updated++;
      }
      return;
    }
    // 除息日當天之前沒持有就沒有配息權利
    const sh=f.exDate>today?sharesAt(f.code,today):sharesAt(f.code,f.exDate,true);
    if(sh<=0)return;
    // 已經手動補登過這次配息就不重複建立
    const lim2=addDays(f.exDate,35);
    if(b.divs.some(d=>d.code===f.code&&d.date>=f.exDate&&d.date<=lim2))return;
    b.events.push({id:uid(),code:f.code,name:f.name||stockName(f.code),exDate:f.exDate,
      payDate:f.payDate||'',perShare:f.perShare,status:'pending',auto:true});
    if(f.name)setName(f.code,f.name);
    added++;
  });
  return{added,updated};
}
function syncDividends(manual){
  const b=book();
  const codes=Array.from(new Set(b.trades.map(t=>t.code)));
  if(!codes.length){if(manual)toast('尚無持股，先新增交易');return Promise.resolve();}
  if(divBusy)return Promise.resolve();
  divBusy=true;if(TAB==='divs')render();
  const found={};
  const put=(code,name,ex,pay,ps)=>{
    code=String(code||'').trim().toUpperCase();
    if(!ex||codes.indexOf(code)<0)return;
    const k=code+'|'+ex;
    const o=found[k]||(found[k]={code,name:'',exDate:ex,payDate:'',perShare:null});
    if(name)o.name=name;if(pay)o.payDate=pay;if(ps!=null)o.perShare=ps;
  };
  // ① 除權除息預告表（上市股票與 ETF：除息日，部分有每股現金股利）
  const p1=jget('https://openapi.twse.com.tw/v1/exchangeReport/TWT48U_ALL').then(arr=>{
    (arr||[]).forEach(o=>{
      if(String(o.Exdividend||'').indexOf('息')<0)return;
      put(o.Code,o.Name,rocDate(o.Date),'',parsePs(o.CashDividend));
    });return true;
  }).catch(e=>{console.warn('TWT48U',e);return false;});
  // ② ETF 收益分配公告（除息日、基準日、發放日、每單位分配金額）
  const p2=jget('https://www.twse.com.tw/rwd/zh/ETF/etfDiv?response=json').then(j=>{
    ((j&&j.data)||[]).forEach(r=>put(r[0],r[1],rocDate(r[2]),rocDate(r[4]),parsePs(r[5])));
    return true;
  }).catch(e=>{console.warn('etfDiv',e);return false;});
  return Promise.all([p1,p2]).then(res=>{
    if(!res[0]&&!res[1])throw new Error('無法連線到證交所，請稍後再試');
    const r=mergeDivEvents(found,codes);
    S.divSync=Date.now();save();
    divBusy=false;render();
    if(manual)toast(r.added||r.updated?('配息公告：新增 '+r.added+' 筆、更新 '+r.updated+' 筆'):'沒有新的配息公告');
  }).catch(e=>{
    divBusy=false;render();
    if(manual)toast(e.message);
  });
}

        },'刪除');

}

function expData(){
  const json=JSON.stringify(S,null,2);
  const fname='etf-backup-'+todayStr()+'.json';
  sheet('匯出備份',
    '<p class="muted" style="margin-top:0;font-size:13px">下載 JSON 檔保存，或複製下面的文字存到記事本／雲端筆記。還原時用「匯入備份」。</p>'+
    '<button class="btn primary block" id="dlBtn">⬇ 下載 '+esc(fname)+'</button>'+
    '<button class="btn block" id="cpBtn" style="margin-top:8px">📋 複製備份文字</button>'+
    '<textarea id="bkTxt" rows="6" style="margin-top:10px" readonly></textarea>',el=>{
      $('#bkTxt',el).value=json;
      $('#dlBtn',el).onclick=()=>{
        if(window.AndroidBridge&&typeof window.AndroidBridge.saveFile==='function'){
          window.AndroidBridge.saveFile(fname,json);return;   // 原生：寫入「下載」資料夾並顯示提示
        }
        const viaLink=()=>{
          try{
            const a=document.createElement('a');
            a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
            a.download=fname;document.body.appendChild(a);a.click();a.remove();
            setTimeout(()=>URL.revokeObjectURL(a.href),4000);
            toast('已匯出備份');
          }catch(e){toast('此環境無法下載，請改用複製文字');}
        };
        const c=window.claude;
        if(c&&typeof c.use==='function'){
          c.use('downloads').then(dl=>{
            if(dl&&dl.save)return dl.save({filename:fname,data:json}).then(()=>toast('已匯出備份'),
              err=>{if(!err||err.code!=='declined')viaLink();});
            viaLink();
          }).catch(viaLink);
        }else viaLink();
      };
      $('#cpBtn',el).onclick=()=>{
        const ta=$('#bkTxt',el);ta.select();ta.setSelectionRange(0,json.length);
        const done=()=>toast('已複製備份文字');
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(json).then(done,()=>{try{document.execCommand('copy');done();}catch(e){toast('請長按選取複製');}});
        else{try{document.execCommand('copy');done();}catch(e){toast('請長按選取複製');}}
      };
    });
}
function impData(){
  const apply=txt=>{
    try{
      const o=JSON.parse(txt);
      if(!o.accounts||!o.books)throw new Error('格式不符');
      S=Object.assign(defaultState(),o);save();closeSheet();applyTheme();render();toast('匯入完成');
    }catch(err){toast('匯入失敗：'+err.message);}
  };
  sheet('匯入備份','<p class="muted" style="margin-top:0;font-size:13px">選擇之前匯出的 JSON 檔，或直接貼上備份文字。匯入後會覆蓋目前所有資料。</p>'+
    '<input type="file" id="fi" accept="application/json,.json">'+
    '<textarea id="ipTxt" rows="5" placeholder="或在這裡貼上備份文字…" style="margin-top:10px"></textarea>'+
    '<button class="btn primary block" id="ipGo" style="margin-top:10px">匯入貼上的內容</button>',el=>{
      $('#fi',el).onchange=e=>{
        const f=e.target.files[0];if(!f)return;
        const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f);
      };
      $('#ipGo',el).onclick=()=>{const t=$('#ipTxt',el).value.trim();if(!t){toast('請先貼上內容');return;}apply(t);};
    });
}

function tradeForm(t,presetCode){
  const isNew=!t;
  t=t||{id:uid(),code:presetCode||'',name:'',type:'buy',date:todayStr(),shares:1000,price:'',fee:'',tax:''};
  sheet(isNew?'新增交易':'編輯交易',
    '<div class="seg-inline" style="margin-bottom:12px"><button data-t="buy" class="'+(t.type==='buy'?'on':'')+'">買進</button>'+
    '<button data-t="sell" class="'+(t.type==='sell'?'on':'')+'">賣出</button></div>'+
    '<div class="grid2">'+
      '<div class="field"><label>股票代號</label><input id="t_code" value="'+esc(t.code)+'" inputmode="numeric"></div>'+
      '<div class="field"><label>名稱（選填）</label><input id="t_name" value="'+esc(t.name||stockName(t.code))+'"></div>'+
      '<div class="field"><label>日期</label><input id="t_date" type="date" value="'+esc(t.date)+'"></div>'+
      '<div class="field"><label>股數</label><input id="t_shares" type="number" inputmode="numeric" value="'+t.shares+'"></div>'+
      '<div class="field"><label>成交價</label><input id="t_price" type="number" step="0.01" inputmode="decimal" value="'+t.price+'"></div>'+
      '<div class="field"><label>手續費</label><input id="t_fee" type="number" inputmode="numeric" value="'+(t.fee===''?'':t.fee)+'" placeholder="自動"></div>'+
      '<div class="field"><label>證交稅（賣出）</label><input id="t_tax" type="number" inputmode="numeric" value="'+(t.tax===''?'':t.tax)+'" placeholder="自動"></div>'+
    '</div>'+
    '<div id="t_prev" class="muted" style="font-size:13px;margin-bottom:12px"></div>'+
    '<div class="btn2"><button class="btn primary" id="t_save">儲存</button>'+
    (isNew?'<button class="btn" id="t_cancel">取消</button>':'<button class="btn" id="t_del">刪除</button>')+'</div>',
  el=>{
    let type=t.type;
    const upd=()=>{
      const sh=+$('#t_shares',el).value||0,pr=+$('#t_price',el).value||0,code=$('#t_code',el).value.trim();
      const amt=sh*pr;
      const fee=$('#t_fee',el).value===''?calcFee(amt):+$('#t_fee',el).value;
      const tax=type==='sell'?($('#t_tax',el).value===''?calcTax(code,amt):+$('#t_tax',el).value):0;
      $('#t_prev',el).innerHTML='成交金額 '+nf(amt)+'　手續費 '+nf(fee)+(type==='sell'?'　證交稅 '+nf(tax):'')+
        '　<b>'+(type==='buy'?'總支出 '+nf(amt+fee):'實收 '+nf(amt-fee-tax))+'</b>';
    };
    $$('[data-t]',el).forEach(b=>b.onclick=()=>{type=b.dataset.t;$$('[data-t]',el).forEach(x=>x.classList.remove('on'));b.classList.add('on');upd();});
    ['t_shares','t_price','t_fee','t_tax','t_code'].forEach(id=>$('#'+id,el).addEventListener('input',upd));
    upd();
    $('#t_save',el).onclick=()=>{
      const code=$('#t_code',el).value.trim().toUpperCase();
      const sh=+$('#t_shares',el).value,pr=+$('#t_price',el).value;
      if(!code||!sh||!pr){toast('請填代號、股數與價格');return;}
      const amt=sh*pr;
      const rec={id:t.id,code,name:$('#t_name',el).value.trim()||stockName(code),type,date:$('#t_date',el).value||todayStr(),
        shares:sh,price:pr,
        fee:$('#t_fee',el).value===''?calcFee(amt):+$('#t_fee',el).value,
        tax:type==='sell'?($('#t_tax',el).value===''?calcTax(code,amt):+$('#t_tax',el).value):0,
        seq:t.seq||Date.now()};
      setName(code,rec.name);
      const b=book(),i=b.trades.findIndex(z=>z.id===t.id);
      if(i>=0)b.trades[i]=rec;else b.trades.push(rec);
      if(b.order.indexOf(code)<0)b.order.push(code);
      save();closeSheet();render();toast(isNew?'已新增交易':'已更新');
    };
    if($('#t_cancel',el))$('#t_cancel',el).onclick=closeSheet;
    if($('#t_del',el))$('#t_del',el).onclick=()=>confirmSheet('刪除交易','確定刪除這筆交易記錄？',()=>{
      const b=book();b.trades=b.trades.filter(z=>z.id!==t.id);save();render();toast('已刪除');},'刪除');
  });
}

      const code=$('#d_code',el).value.trim().toUpperCase();

      const rec={id:d.id,code,name:$('#d_name',el).value.trim()||stockName(code),date:$('#d_date',el).value||todayStr(),
        perShare:ps,shares:sh,tax:+$('#d_tax',el).value||0};
      rec.amount=Math.round(ps*sh-rec.tax);
      setName(code,rec.name);
      const b=book(),i=b.divs.findIndex(z=>z.id===d.id);
      if(i>=0)b.divs[i]=rec;else b.divs.push(rec);
      save();closeSheet();render();toast(isNew?'已新增配息':'已更新');
    };
    if($('#d_cancel',el))$('#d_cancel',el).onclick=closeSheet;
    if($('#d_del',el))$('#d_del',el).onclick=()=>confirmSheet('刪除配息','確定刪除這筆配息記錄？',()=>{
      const b=book();b.divs=b.divs.filter(z=>z.id!==d.id);save();render();toast('已刪除');},'刪除');
  });

/* =================== 路由 =================== */
let TAB='overview';
function setView(html,fab){
  $('#view').innerHTML=html;
  const f=$('#fab');
  if(fab){f.classList.remove('hide');f.classList.toggle('green',fab==='div');
    f.onclick=()=>fab==='div'?divForm():tradeForm();}
  else f.classList.add('hide');
  window.scrollTo(0,0);
}
function render(){
  const a=acct();
  $('#acctName').textContent=a.name;
  $('#avatarBtn').textContent=a.avatar||'🐱';
  $$('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  ({overview:viewOverview,trades:viewTrades,divs:viewDivs,
    analysis:viewAnalysis,quotes:viewQuotes,settings:viewSettings}[TAB]||viewOverview)();
}
function init(){
  load();applyTheme();
  $$('#tabbar button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();});
  $('#acctBtn').onclick=switchAcct;
  $('#avatarBtn').onclick=editProfile;
  render();
  if(book().trades.length)setTimeout(()=>fetchQuotes(false),600);
  // 配息公告：開啟時若距離上次更新超過 3 小時就自動抓（失敗時不打擾）
  if(book().trades.length&&Date.now()-(S.divSync||0)>3*3600*1000)setTimeout(()=>syncDividends(false),1800);
  // 回到前景時（切換 App／螢幕解鎖）自動更新，最多每 60 秒一次
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&book().trades.length&&Date.now()-lastQuoteAt>60000)fetchQuotes(false);
  });
}
/* 返回鍵：先關對話框，再回總覽，最後才離開 App（回傳 true 表示已處理） */
function back(){
  if($('#modalRoot').children.length){closeSheet();return true;}
  if(TAB!=='overview'){TAB='overview';render();return true;}
  return false;
}
window.__app={get S(){return S;},compute,init,render,back,parseRealtime,syncDividends,mergeDivEvents,rocDate,parsePs,set TAB(v){TAB=v;},get TAB(){return TAB;}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
